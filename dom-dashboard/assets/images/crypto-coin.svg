<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Moeda criptográfica estilizada</title>
  <desc id="desc">Ilustração de uma moeda dourada com o símbolo do Bitcoin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292368"/>
      <stop offset="1" stop-color="#655cce"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27b"/>
      <stop offset="1" stop-color="#d97941"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#0a0730" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="320" height="320" rx="36" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="112" fill="none" stroke="#fff" stroke-opacity=".22"/>
  <circle cx="160" cy="160" r="91" fill="none" stroke="#fff" stroke-opacity=".2" stroke-dasharray="6 9"/>
  <circle cx="160" cy="160" r="72" fill="url(#gold)" stroke="#fff" stroke-opacity=".38" stroke-width="7" filter="url(#shadow)"/>
  <text x="160" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#fff">₿</text>
  <text x="24" y="42" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#fff" fill-opacity=".7">DECENTRALIZED</text>
  <text x="296" y="296" text-anchor="end" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#fff" fill-opacity=".7">OPEN PROTOCOL</text>
</svg>
